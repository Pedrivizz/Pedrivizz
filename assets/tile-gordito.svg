<svg xmlns="http://www.w3.org/2000/svg" width="440" height="124" viewBox="0 0 440 124" role="img" aria-label="El Gordito: agente de pedidos por chat y voz para una pollería, con paneles de caja y cocina (en línea)">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .bg{fill:#FDF1EE}.ac{fill:#C4161C}.st{fill:#8F1015}.on{fill:#FFFFFF}.n{fill:#1F2328}.d{fill:#59636E}
    @media (prefers-color-scheme:dark){.on{fill:#FFFFFF}.bg{fill:#2A1414}.ac{fill:#E5484D}.st{fill:#FF9B9E}.n{fill:#E6EDF3}.d{fill:#9198A1}}
  </style>
  <rect width="440" height="124" rx="16" class="bg"/>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.15s" fill="freeze"/><circle cx="42" cy="50" r="20" class="ac"/>
    <text x="42" y="56.5" font-size="17" font-weight="700" text-anchor="middle" class="on">G</text>
    <text x="76" y="44" font-size="17" font-weight="650" class="n">El Gordito</text>
    <text x="76" y="68" font-size="13.5" class="d">Agente de pedidos para una pollería de</text>
    <text x="76" y="88" font-size="13.5" class="d">San Miguel: chat, mozo de voz, caja y cocina</text>
    <text x="418" y="30" font-size="12" font-weight="600" text-anchor="end" class="st">en línea ↗</text></g>
</svg>
