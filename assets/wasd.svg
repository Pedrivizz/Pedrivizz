<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170" role="img" aria-label="W.A.S.D: startup de Lima que ayuda a pymes a conseguir, atender y fidelizar clientes por internet con webs, WhatsApp con IA y reservas">
